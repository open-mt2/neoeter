name: EffectLib CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build liblzo2-dev libzip-dev libjpeg-dev libgl1-mesa-dev libglu1-mesa-dev libegl-dev libgl1-mesa-dri libsdl2-dev libfreetype-dev zlib1g-dev

      - name: Install miniaudio
        run: |
          MINIAUDIO_VERSION=0.11.25
          sudo mkdir -p /usr/local/include/miniaudio /usr/local/lib/pkgconfig
          sudo curl -fsSL "https://raw.githubusercontent.com/mackron/miniaudio/${MINIAUDIO_VERSION}/miniaudio.h" \
            -o /usr/local/include/miniaudio/miniaudio.h
          printf '#define MINIAUDIO_IMPLEMENTATION\n#include <miniaudio/miniaudio.h>\n' > /tmp/miniaudio.c
          cc -O2 -fPIC -I/usr/local/include -c /tmp/miniaudio.c -o /tmp/miniaudio.o
          sudo ar rcs /usr/local/lib/libminiaudio.a /tmp/miniaudio.o
          printf '%s\n' \
            'prefix=/usr/local' \
            'exec_prefix=${prefix}' \
            'libdir=${exec_prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: miniaudio' \
            'Description: Single-file audio playback and capture library' \
            "Version: ${MINIAUDIO_VERSION}" \
            'Cflags: -I${includedir}' \
            'Libs: -L${libdir} -lminiaudio' \
            'Libs.private: -lpthread -ldl -lm' \
            | sudo tee /usr/local/lib/pkgconfig/miniaudio.pc > /dev/null
          sudo ldconfig
          pkg-config --modversion miniaudio

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
